<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter - Arcade Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .container {
            width: 90vw;
            height: 90vh;
            max-width: 1200px;
            max-height: 800px;
            display: flex;
            gap: 20px;
            background: rgba(10, 14, 39, 0.8);
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3), inset 0 0 30px rgba(0, 255, 136, 0.1);
            overflow: hidden;
        }

        #gameCanvas {
            flex: 1;
            display: block;
            background: radial-gradient(ellipse at center, rgba(0, 255, 136, 0.05) 0%, transparent 70%),
                        linear-gradient(180deg, #0a0e27 0%, #1a1f3a 100%);
            cursor: crosshair;
            border-right: 2px solid #00ff88;
        }

        .sidebar {
            width: 250px;
            display: flex;
            flex-direction: column;
            padding: 30px;
            gap: 25px;
            overflow-y: auto;
            background: linear-gradient(180deg, rgba(0, 255, 136, 0.05) 0%, rgba(0, 100, 200, 0.05) 100%);
        }

        .game-title {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 20px rgba(0, 255, 136, 0.8); }
            50% { opacity: 0.8; text-shadow: 0 0 30px rgba(0, 255, 136, 1); }
        }

        .stat-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-label {
            font-size: 12px;
            color: #00aaff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat-value {
            font-size: 24px;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
            font-weight: bold;
        }

        .health-bar {
            width: 100%;
            height: 25px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ff88;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00aaff);
            width: 100%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
        }

        .health-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            color: #fff;
            font-weight: bold;
            z-index: 1;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 12px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            border: 2px solid #00ff88;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            border-radius: 3px;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
        }

        button:hover:not(:disabled) {
            background: rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
            transform: scale(1.05);
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #666;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            border: 3px solid #00ff88;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.5);
            max-width: 500px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 40px;
            margin-bottom: 20px;
            color: #ff0055;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
        }

        .modal-score {
            font-size: 30px;
            margin-bottom: 10px;
            color: #00ff88;
        }

        .modal-label {
            font-size: 14px;
            color: #00aaff;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .modal-button {
            margin-top: 20px;
            min-width: 150px;
        }

        .level-indicator {
            font-size: 12px;
            text-align: center;
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.6);
        }

        .controls-info {
            font-size: 11px;
            color: #00aaff;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-left: 2px solid #00aaff;
            border-radius: 3px;
        }

        .mobile-controls {
            display: none;
            gap: 10px;
            margin-top: 10px;
        }

        .mobile-btn {
            flex: 1;
            padding: 15px !important;
            font-size: 12px !important;
            min-height: 50px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                width: 95vw;
                height: 95vh;
            }

            #gameCanvas {
                border-right: none;
                border-bottom: 2px solid #00ff88;
            }

            .sidebar {
                width: 100%;
                height: auto;
                padding: 15px;
                gap: 15px;
            }

            .mobile-controls {
                display: flex;
            }

            .controls-info {
                display: none;
            }

            .game-title {
                font-size: 20px;
            }

            .stat-value {
                font-size: 18px;
            }
        }

        .powerup-indicator {
            font-size: 11px;
            color: #ffaa00;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.6);
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.5; }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 255, 136, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="sidebar">
            <div class="game-title">⚡ SPACE SHOOTER ⚡</div>
            
            <div class="stat-group">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>

            <div class="stat-group">
                <div class="stat-label">High Score</div>
                <div class="stat-value" id="highScore">0</div>
            </div>

            <div class="stat-group">
                <div class="stat-label">Health</div>
                <div class="health-bar">
                    <div class="health-fill" id="healthFill"></div>
                    <div class="health-text" id="healthText">100/100</div>
                </div>
            </div>

            <div class="stat-group">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="level">1</div>
                <div class="level-indicator" id="levelIndicator">Easy</div>
            </div>

            <div class="stat-group">
                <div class="stat-label">Wave</div>
                <div class="stat-value" id="wave">1</div>
            </div>

            <div id="powerupDisplay" style="display: none;">
                <div class="stat-label">Active Power-Up</div>
                <div class="powerup-indicator" id="powerupName">---</div>
            </div>

            <div class="button-group">
                <button id="startBtn" onclick="game.start()">Start Game</button>
                <button id="pauseBtn" onclick="game.pause()" disabled>Pause</button>
                <button id="restartBtn" onclick="game.restart()" disabled>Restart</button>
            </div>

            <div class="controls-info">
                <strong>Controls:</strong><br>
                �� A - Move Left<br>
                → D - Move Right<br>
                SPACE - Shoot<br>
                P - Pause
            </div>

            <div class="mobile-controls" id="mobileControls">
                <button class="mobile-btn" id="leftBtn">◀</button>
                <button class="mobile-btn" id="shootBtn">💥</button>
                <button class="mobile-btn" id="rightBtn">▶</button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">GAME OVER</div>
            <div class="modal-label">Final Score</div>
            <div class="modal-score" id="finalScore">0</div>
            <div class="modal-label" id="highScoreMessage"></div>
            <button class="modal-button" onclick="game.restart()">Play Again</button>
        </div>
    </div>

    <!-- Pause Modal -->
    <div id="pauseModal" class="modal">
        <div class="modal-content">
            <div class="modal-title" style="color: #ffaa00;">PAUSED</div>
            <div class="modal-label">Press P or Click Resume to Continue</div>
            <button class="modal-button" onclick="game.pause()">Resume</button>
        </div>
    </div>

    <script>
        // ========== GAME CONFIGURATION ==========
        const CONFIG = {
            canvasWidth: 800,
            canvasHeight: 600,
            playerWidth: 30,
            playerHeight: 40,
            playerSpeed: 5,
            bulletSpeed: 7,
            bulletWidth: 5,
            bulletHeight: 15,
        };

        // ========== SOUND MANAGER ==========
        class SoundManager {
            constructor() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            play(type) {
                const ctx = this.audioContext;
                const now = ctx.currentTime;

                switch(type) {
                    case 'shoot':
                        this.playShoot(now);
                        break;
                    case 'hit':
                        this.playHit(now);
                        break;
                    case 'powerup':
                        this.playPowerup(now);
                        break;
                    case 'gameOver':
                        this.playGameOver(now);
                        break;
                }
            }

            playShoot(now) {
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                osc.connect(gain);
                gain.connect(this.audioContext.destination);
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.setValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }

            playHit(now) {
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                osc.connect(gain);
                gain.connect(this.audioContext.destination);
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.setValueAtTime(400, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.setValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            playPowerup(now) {
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                osc.connect(gain);
                gain.connect(this.audioContext.destination);
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(800, now + 0.1);
                osc.frequency.setValueAtTime(1000, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.setValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }

            playGameOver(now) {
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                osc.connect(gain);
                gain.connect(this.audioContext.destination);
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.setValueAtTime(300, now + 0.3);
                osc.frequency.setValueAtTime(200, now + 0.6);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.setValueAtTime(0, now + 0.8);
                osc.start(now);
                osc.stop(now + 0.8);
            }
        }

        // ========== PARTICLE SYSTEM ==========
        class Particle {
            constructor(x, y, vx, vy, color, life) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = life;
                this.maxLife = life;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2; // gravity
                this.life--;
            }

            draw(ctx) {
                const alpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            isAlive() {
                return this.life > 0;
            }
        }

        // ========== PLAYER CLASS ==========
        class Player {
            constructor() {
                this.x = CONFIG.canvasWidth / 2 - CONFIG.playerWidth / 2;
                this.y = CONFIG.canvasHeight - 60;
                this.width = CONFIG.playerWidth;
                this.height = CONFIG.playerHeight;
                this.speed = CONFIG.playerSpeed;
                this.health = 100;
                this.maxHealth = 100;
            }

            moveLeft() {
                if (this.x > 0) {
                    this.x -= this.speed;
                }
            }

            moveRight() {
                if (this.x < CONFIG.canvasWidth - this.width) {
                    this.x += this.speed;
                }
            }

            shoot() {
                return new Bullet(this.x + this.width / 2 - CONFIG.bulletWidth / 2, this.y);
            }

            takeDamage(amount) {
                this.health = Math.max(0, this.health - amount);
            }

            heal(amount) {
                this.health = Math.min(this.maxHealth, this.health + amount);
            }

            draw(ctx) {
                // Player body
                ctx.fillStyle = '#00ff88';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.lineTo(this.x, this.y + this.height);
                ctx.closePath();
                ctx.fill();

                // Glow
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Shield indicator if active
                if (game.shieldActive) {
                    ctx.strokeStyle = 'rgba(0, 255, 255, 0.6)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x + this.width / 2, this.y + this.height / 2, this.width + 10, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }

        // ========== BULLET CLASS ==========
        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = CONFIG.bulletWidth;
                this.height = CONFIG.bulletHeight;
                this.speed = CONFIG.bulletSpeed;
            }

            update() {
                this.y -= this.speed;
            }

            draw(ctx) {
                ctx.fillStyle = '#00ff88';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowColor = '#00ff88';
                ctx.shadowBlur = 10;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }

            isOffScreen() {
                return this.y < 0;
            }
        }

        // ========== ENEMY CLASSES ==========
        class Enemy {
            constructor(x, y, type = 'normal') {
                this.x = x;
                this.y = y;
                this.type = type;
                this.width = 25;
                this.height = 25;

                switch(type) {
                    case 'normal':
                        this.speed = 1 + (game.level * 0.3);
                        this.health = 1;
                        this.maxHealth = 1;
                        this.score = 10;
                        this.color = '#00aaff';
                        break;
                    case 'strong':
                        this.width = 35;
                        this.height = 35;
                        this.speed = 0.7 + (game.level * 0.2);
                        this.health = 3;
                        this.maxHealth = 3;
                        this.score = 30;
                        this.color = '#ff00ff';
                        break;
                    case 'fast':
                        this.width = 20;
                        this.height = 20;
                        this.speed = 2.5 + (game.level * 0.4);
                        this.health = 1;
                        this.maxHealth = 1;
                        this.score = 20;
                        this.color = '#ffaa00';
                        break;
                }
            }

            update() {
                this.y += this.speed;
            }

            takeDamage() {
                this.health--;
            }

            draw(ctx) {
                // Enemy body
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Glow
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);

                // Health indicator for strong enemies
                if (this.type === 'strong') {
                    const healthPercent = this.health / this.maxHealth;
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(this.x, this.y - 8, this.width * healthPercent, 4);
                }
            }

            isAlive() {
                return this.health > 0;
            }

            isOffScreen() {
                return this.y > CONFIG.canvasHeight;
            }
        }

        // ========== POWERUP CLASS ==========
        class PowerUp {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.width = 20;
                this.height = 20;
                this.speed = 1;
                this.rotation = 0;

                switch(type) {
                    case 'rapidFire':
                        this.color = '#ff0055';
                        this.label = 'RAPID FIRE';
                        break;
                    case 'shield':
                        this.color = '#00ffff';
                        this.label = 'SHIELD';
                        break;
                    case 'doubleScore':
                        this.color = '#ffaa00';
                        this.label = '2X SCORE';
                        break;
                }
            }

            update() {
                this.y += this.speed;
                this.rotation += 0.1;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(this.rotation);

                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();

                // Pulsing glow
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, this.y + this.height / 2, this.width / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            isOffScreen() {
                return this.y > CONFIG.canvasHeight;
            }
        }

        // ========== MAIN GAME CLASS ==========
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.canvas.width = CONFIG.canvasWidth;
                this.canvas.height = CONFIG.canvasHeight;

                this.player = new Player();
                this.bullets = [];
                this.enemies = [];
                this.particles = [];
                this.powerups = [];

                this.score = 0;
                this.level = 1;
                this.wave = 1;
                this.highScore = localStorage.getItem('spaceShooterHighScore') || 0;
                this.gameRunning = false;
                this.gamePaused = false;
                this.gameOver = false;

                this.keys = {};
                this.touchLeft = false;
                this.touchRight = false;
                this.touchShoot = false;

                this.shootCooldown = 0;
                this.baseshootCooldown = 10;
                this.rapidFireActive = false;
                this.rapidFireTimer = 0;
                this.shieldActive = false;
                this.shieldTimer = 0;
                this.doubleScoreActive = false;
                this.doubleScoreTimer = 0;

                this.enemySpawnRate = 0.02;
                this.enemySpawnTimer = 0;
                this.waveEnemyCount = 0;
                this.waveEnemyLimit = 10;

                this.soundManager = new SoundManager();
                this.stars = this.generateStars();

                this.setupEventListeners();
                this.updateHighScore();
            }

            generateStars() {
                const stars = [];
                for (let i = 0; i < 100; i++) {
                    stars.push({
                        x: Math.random() * CONFIG.canvasWidth,
                        y: Math.random() * CONFIG.canvasHeight,
                        radius: Math.random() * 1.5,
                        opacity: Math.random() * 0.5 + 0.5
                    });
                }
                return stars;
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    this.keys[e.key] = true;

                    if (e.key === ' ') {
                        e.preventDefault();
                        this.touchShoot = true;
                    }
                    if (e.key === 'p' || e.key === 'P') {
                        e.preventDefault();
                        if (this.gameRunning) this.pause();
                    }
                });

                document.addEventListener('keyup', (e) => {
                    this.keys[e.key] = false;
                    if (e.key === ' ') {
                        this.touchShoot = false;
                    }
                });

                // Mobile controls
                document.getElementById('leftBtn').addEventListener('touchstart', () => this.touchLeft = true);
                document.getElementById('leftBtn').addEventListener('touchend', () => this.touchLeft = false);
                document.getElementById('rightBtn').addEventListener('touchstart', () => this.touchRight = true);
                document.getElementById('rightBtn').addEventListener('touchend', () => this.touchRight = false);
                document.getElementById('shootBtn').addEventListener('touchstart', () => this.touchShoot = true);
                document.getElementById('shootBtn').addEventListener('touchend', () => this.touchShoot = false);

                // Mouse controls
                document.getElementById('leftBtn').addEventListener('mousedown', () => this.touchLeft = true);
                document.getElementById('leftBtn').addEventListener('mouseup', () => this.touchLeft = false);
                document.getElementById('rightBtn').addEventListener('mousedown', () => this.touchRight = true);
                document.getElementById('rightBtn').addEventListener('mouseup', () => this.touchRight = false);
                document.getElementById('shootBtn').addEventListener('mousedown', () => this.touchShoot = true);
                document.getElementById('shootBtn').addEventListener('mouseup', () => this.touchShoot = false);
            }

            start() {
                if (this.gameRunning) return;
                this.gameRunning = true;
                this.gamePaused = false;
                this.gameOver = false;
                this.score = 0;
                this.level = 1;
                this.wave = 1;
                this.player.health = this.player.maxHealth;
                this.enemies = [];
                this.bullets = [];
                this.powerups = [];
                this.particles = [];
                this.waveEnemyCount = 0;
                this.waveEnemyLimit = 10;
                this.rapidFireActive = false;
                this.shieldActive = false;
                this.doubleScoreActive = false;

                document.getElementById('startBtn').disabled = true;
                document.getElementById('pauseBtn').disabled = false;
                document.getElementById('restartBtn').disabled = false;
                document.getElementById('gameOverModal').classList.remove('show');
                document.getElementById('pauseModal').classList.remove('show');

                this.gameLoop();
            }

            pause() {
                if (!this.gameRunning) return;
                this.gamePaused = !this.gamePaused;
                const pauseModal = document.getElementById('pauseModal');

                if (this.gamePaused) {
                    pauseModal.classList.add('show');
                } else {
                    pauseModal.classList.remove('show');
                    this.gameLoop();
                }
            }

            restart() {
                this.gameRunning = false;
                this.gamePaused = false;
                this.gameOver = false;
                this.bullets = [];
                this.enemies = [];
                this.powerups = [];
                this.particles = [];
                this.score = 0;
                this.level = 1;
                this.wave = 1;
                this.player.health = this.player.maxHealth;
                this.rapidFireActive = false;
                this.shieldActive = false;
                this.doubleScoreActive = false;

                document.getElementById('startBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
                document.getElementById('restartBtn').disabled = true;
                document.getElementById('gameOverModal').classList.remove('show');
                document.getElementById('pauseModal').classList.remove('show');

                this.draw();
            }

            update() {
                if (!this.gameRunning || this.gamePaused) return;

                // Player movement
                if (this.keys['ArrowLeft'] || this.keys['a'] || this.keys['A'] || this.touchLeft) {
                    this.player.moveLeft();
                }
                if (this.keys['ArrowRight'] || this.keys['d'] || this.keys['D'] || this.touchRight) {
                    this.player.moveRight();
                }

                // Shooting
                this.shootCooldown--;
                if ((this.keys[' '] || this.touchShoot) && this.shootCooldown <= 0) {
                    const shootDelay = this.rapidFireActive ? 3 : this.baseshootCooldown;
                    this.shootCooldown = shootDelay;
                    this.bullets.push(this.player.shoot());
                    this.soundManager.play('shoot');
                }

                // Update bullets
                this.bullets = this.bullets.filter(bullet => {
                    bullet.update();
                    return !bullet.isOffScreen();
                });

                // Update enemies
                this.enemies.forEach(enemy => enemy.update());

                // Spawn enemies
                this.enemySpawnRate = Math.min(0.08, 0.02 + (this.level * 0.01));
                if (Math.random() < this.enemySpawnRate && this.waveEnemyCount < this.waveEnemyLimit) {
                    const types = ['normal', 'normal', 'normal', 'strong', 'fast'];
                    const randomType = types[Math.floor(Math.random() * types.length)];
                    const x = Math.random() * (CONFIG.canvasWidth - 25);
                    this.enemies.push(new Enemy(x, -30, randomType));
                    this.waveEnemyCount++;
                }

                // Collision detection: bullets vs enemies
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    for (let j = this.enemies.length - 1; j >= 0; j--) {
                        if (this.checkCollision(this.bullets[i], this.enemies[j])) {
                            this.enemies[j].takeDamage();

                            if (!this.enemies[j].isAlive()) {
                                const scorePoints = this.enemies[j].score * (this.doubleScoreActive ? 2 : 1);
                                this.score += scorePoints;
                                this.soundManager.play('hit');
                                this.createExplosion(this.enemies[j].x, this.enemies[j].y, this.enemies[j].color);

                                // Random powerup drop
                                if (Math.random() < 0.15) {
                                    const types = ['rapidFire', 'shield', 'doubleScore'];
                                    const randomType = types[Math.floor(Math.random() * types.length)];
                                    this.powerups.push(new PowerUp(
                                        this.enemies[j].x + this.enemies[j].width / 2,
                                        this.enemies[j].y,
                                        randomType
                                    ));
                                }

                                this.enemies.splice(j, 1);
                            }
                            this.bullets.splice(i, 1);
                            break;
                        }
                    }
                }

                // Update and check powerups
                this.powerups = this.powerups.filter(p => {
                    p.update();
                    return !p.isOffScreen();
                });

                for (let i = this.powerups.length - 1; i >= 0; i--) {
                    if (this.checkCollision(this.player, this.powerups[i])) {
                        this.activatePowerUp(this.powerups[i].type);
                        this.soundManager.play('powerup');
                        this.powerups.splice(i, 1);
                    }
                }

                // Collision detection: enemies vs player
                this.enemies.forEach((enemy, index) => {
                    if (this.checkCollision(this.player, enemy)) {
                        if (this.shieldActive) {
                            this.shieldActive = false;
                            this.shieldTimer = 0;
                            document.getElementById('powerupDisplay').style.display = 'none';
                            this.enemies.splice(index, 1);
                            this.createExplosion(enemy.x, enemy.y, enemy.color);
                        } else {
                            this.player.takeDamage(20);
                            this.enemies.splice(index, 1);
                            this.createExplosion(enemy.x, enemy.y, enemy.color);
                        }
                    }
                });

                // Remove off-screen enemies
                this.enemies = this.enemies.filter(enemy => {
                    if (enemy.isOffScreen()) {
                        if (!this.shieldActive) {
                            this.player.takeDamage(10);
                        }
                        return false;
                    }
                    return true;
                });

                // Update particles
                this.particles = this.particles.filter(p => {
                    p.update();
                    return p.isAlive();
                });

                // Update powerup timers
                if (this.rapidFireActive) {
                    this.rapidFireTimer--;
                    if (this.rapidFireTimer <= 0) {
                        this.rapidFireActive = false;
                    }
                }

                if (this.shieldActive) {
                    this.shieldTimer--;
                    if (this.shieldTimer <= 0) {
                        this.shieldActive = false;
                        document.getElementById('powerupDisplay').style.display = 'none';
                    }
                }

                if (this.doubleScoreActive) {
                    this.doubleScoreTimer--;
                    if (this.doubleScoreTimer <= 0) {
                        this.doubleScoreActive = false;
                        document.getElementById('powerupDisplay').style.display = 'none';
                    }
                }

                // Wave progression
                if (this.waveEnemyCount >= this.waveEnemyLimit && this.enemies.length === 0) {
                    this.wave++;
                    this.level = Math.ceil(this.wave / 2);
                    this.waveEnemyCount = 0;
                    this.waveEnemyLimit = Math.min(20, 10 + this.wave * 2);
                    this.score += 100 * (this.doubleScoreActive ? 2 : 1);
                }

                // Game Over
                if (this.player.health <= 0) {
                    this.endGame();
                }

                this.updateUI();
            }

            createExplosion(x, y, color) {
                for (let i = 0; i < 12; i++) {
                    const angle = (Math.PI * 2 * i) / 12;
                    const vx = Math.cos(angle) * 4;
                    const vy = Math.sin(angle) * 4;
                    this.particles.push(new Particle(x, y, vx, vy, color, 30));
                }
            }

            activatePowerUp(type) {
                const powerupDisplay = document.getElementById('powerupDisplay');

                switch(type) {
                    case 'rapidFire':
                        this.rapidFireActive = true;
                        this.rapidFireTimer = 300; // 5 seconds at 60 FPS
                        document.getElementById('powerupName').textContent = '⚡ RAPID FIRE';
                        powerupDisplay.style.display = 'block';
                        break;
                    case 'shield':
                        this.shieldActive = true;
                        this.shieldTimer = 300;
                        document.getElementById('powerupName').textContent = '🛡️ SHIELD';
                        powerupDisplay.style.display = 'block';
                        break;
                    case 'doubleScore':
                        this.doubleScoreActive = true;
                        this.doubleScoreTimer = 300;
                        document.getElementById('powerupName').textContent = '✦ 2X SCORE';
                        powerupDisplay.style.display = 'block';
                        break;
                }
            }

            checkCollision(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }

            updateUI() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('level').textContent = this.level;
                document.getElementById('wave').textContent = this.wave;
                document.getElementById('healthText').textContent = `${Math.ceil(this.player.health)}/100`;
                document.getElementById('healthFill').style.width = (this.player.health / this.player.maxHealth) * 100 + '%';

                // Level indicator text
                let levelText = 'Easy';
                if (this.level >= 3) levelText = 'Hard';
                else if (this.level >= 2) levelText = 'Medium';
                document.getElementById('levelIndicator').textContent = levelText;
            }

            updateHighScore() {
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('spaceShooterHighScore', this.highScore);
                }
                document.getElementById('highScore').textContent = this.highScore;
            }

            endGame() {
                this.gameRunning = false;
                this.gameOver = true;
                this.updateHighScore();

                document.getElementById('finalScore').textContent = this.score;
                const highScoreMsg = document.getElementById('highScoreMessage');

                if (this.score >= this.highScore) {
                    highScoreMsg.textContent = '🏆 NEW HIGH SCORE! 🏆';
                    highScoreMsg.style.color = '#ffaa00';
                } else {
                    highScoreMsg.textContent = `High Score: ${this.highScore}`;
                    highScoreMsg.style.color = '#00aaff';
                }

                document.getElementById('gameOverModal').classList.add('show');
                document.getElementById('startBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
                document.getElementById('restartBtn').disabled = false;

                this.soundManager.play('gameOver');
                this.draw();
            }

            draw() {
                // Draw background
                this.ctx.fillStyle = '#0a0e27';
                this.ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

                // Draw stars
                this.ctx.fillStyle = '#ffffff';
                this.stars.forEach(star => {
                    this.ctx.globalAlpha = star.opacity;
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                this.ctx.globalAlpha = 1;

                // Draw grid pattern
                this.ctx.strokeStyle = 'rgba(0, 255, 136, 0.05)';
                this.ctx.lineWidth = 1;
                for (let i = 0; i < CONFIG.canvasWidth; i += 50) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i, 0);
                    this.ctx.lineTo(i, CONFIG.canvasHeight);
                    this.ctx.stroke();
                }
                for (let i = 0; i < CONFIG.canvasHeight; i += 50) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, i);
                    this.ctx.lineTo(CONFIG.canvasWidth, i);
                    this.ctx.stroke();
                }

                // Draw game objects
                this.player.draw(this.ctx);
                this.bullets.forEach(bullet => bullet.draw(this.ctx));
                this.enemies.forEach(enemy => enemy.draw(this.ctx));
                this.powerups.forEach(powerup => powerup.draw(this.ctx));
                this.particles.forEach(particle => particle.draw(this.ctx));
            }

            gameLoop() {
                if (this.gameRunning && !this.gamePaused) {
                    this.update();
                }
                this.draw();

                if (this.gameRunning && !this.gameOver) {
                    requestAnimationFrame(() => this.gameLoop());
                }
            }
        }

        // ========== INITIALIZE GAME ==========
        const game = new Game();
        game.draw();

        // Responsive canvas
        window.addEventListener('resize', () => {
            const rect = game.canvas.parentElement.getBoundingClientRect();
            if (rect.width < 800) {
                game.canvas.width = Math.min(CONFIG.canvasWidth, rect.width - 20);
            }
        });
    </script>
</body>
</html>
